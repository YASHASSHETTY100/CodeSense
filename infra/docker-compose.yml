services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codesense
      POSTGRES_PASSWORD: codesense
      POSTGRES_DB: codesense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://codesense:codesense@postgres:5432/codesense
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/code
      - repodata:/code/data

  worker:
    build: ../backend
    command: celery -A worker.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://codesense:codesense@postgres:5432/codesense
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - postgres
    volumes:
      - ../backend:/code
      - repodata:/code/data

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  repodata:
